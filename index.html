<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramzan Count Down</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="container">
    <h1>🌙 Countdown to Ramzan 2027 🌙</h1>
    <div class="timer">
      <div class="time-box">
        <span id="months" class="flip">0</span>
        <small>Months</small>
      </div>
      <div class="time-box">
        <span id="days" class="flip">0</span>
        <small>Days</small>
      </div>
      <div class="time-box">
        <span id="hours" class="flip">0</span>
        <small>Hours</small>
      </div>
      <div class="time-box">
        <span id="minutes" class="flip">0</span>
        <small>Minutes</small>
      </div>
      <div class="time-box">
        <span id="seconds" class="flip">0</span>
        <small>Seconds</small>
      </div>
    </div>
    
  </div>
    
    <script src="app.js"></script>
</body>
</html>
